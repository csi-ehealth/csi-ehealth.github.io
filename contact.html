<!DOCTYPE HTML>
<html>

<head>
  <title>Contato</title>
  <meta name="description" content="website description" />
  <meta name="keywords" content="website keywords, website keywords" />
  <meta charset="UTF-8">
  <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
  <link rel="stylesheet" type="text/css" href="style/style.css" title="style" />
</head>

<body>
  <div id="main">
    <div id="header">
      <div id="logo">
        <div id="logo_text">
          <!-- class="logo_colour", allows you to change the colour of the text -->
          <h1><a href="index.html">Midiacom<span class="logo_colour">Lab.</span></a></h1>
          <h2>eHealth</h2>
        </div>
      </div>
      <div id="menubar">
        <ul id="menu">
          <!-- put class="selected" in the li tag for the selected page - to highlight which page you're on -->
          <li><a href="index.html">Home</a></li>
          <li><a href="members.html">Membros</a></li>
          <li><a href="papers.html">Trabalhos</a></li>
          <!-- <li><a href="another_page.html">Another Page</a></li> -->
          <li class="selected"><a href="contact.html">Contato</a></li>
        </ul>
      </div>
    </div>
    <div id="content_header"></div>
    <div id="site_content">
      <div id="content">
        <!-- insert the page content here -->
        <h1>Contato</h1>
        <p>Por favor preencher o formulario:</p>
        <form id="contactForm">
          <div class="form_settings">
            <p><span>Name</span><input class="contact" type="text" id="name" name="name" required /></p>
            <p><span>Email Address</span><input class="contact" type="email" id="email" name="email" required /></p>
            <p><span>Message</span><textarea class="contact textarea" rows="8" cols="50" id="message" name="message" required></textarea></p>
            <p style="padding-top: 15px"><span>&nbsp;</span><input class="submit" type="submit" value="Enviar" /></p>
          </div>
        </form>
        <p id="formStatus"></p>
      </div>
    </div>
    <div id="content_footer"></div>
    <div id="footer">
      Copyright &copy; midiacomlab | <a href="www.midiacom.uff.br">design from www.midiacom.uff.br</a>
    </div>
  </div>
<!--<div style="text-align: center; font-size: 0.75em;">Design downloaded from <a href="http://www.freewebtemplates.com/">free website templates</a>.</div>-->
  <script type="module">
    import PocketBase from 'https://cdn.jsdelivr.net/npm/pocketbase@0.21.5/+esm';

    const pb = new PocketBase('https://ehealth-uff.duckdns.org/');
    //const pb = new PocketBase('http://127.0.0.1:8090');

    document.getElementById('contactForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const formStatus = document.getElementById('formStatus');
      const submitButton = document.querySelector('input[type="submit"]');
      
      try {
        submitButton.disabled = true;
        formStatus.innerHTML = '<p>Enviando mensagem...</p>';
        
        const data = {
          name: document.getElementById('name').value,
          email: document.getElementById('email').value,
          message: document.getElementById('message').value,
          status: 'received'
        };

        const record = await pb.collection('contact_messages').create(data);
        
        formStatus.innerHTML = '<p style="color: green;">Mensagem enviada com sucesso! Entraremos em contato em breve.</p>';
        document.getElementById('contactForm').reset();
        
      } catch (error) {
        console.error('Erro ao enviar mensagem:', error);
        formStatus.innerHTML = '<p style="color: red;">Erro ao enviar mensagem. Por favor, tente novamente.</p>';
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
